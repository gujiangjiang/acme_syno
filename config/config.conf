# ===============================================================
# acme.sh 群晖自动证书部署 配置文件
# ===============================================================

# ===============================================================
# 基础配置
# ===============================================================

# acme.sh Docker 容器的名称 (通常为 acme.sh)
ACME_CONTAINER_NAME='acme.sh'

# 你的域名
DOMAIN=''

# 证书供应商 (例如: letsencrypt, buypass, zerossl)
CERT_SERVER='letsencrypt'

# DNS 供应商:
# dns_cf (Cloudflare)
# dns_dp (腾讯云 DNSPOD)
# dns_ali (阿里云)
# 更多请查阅: https://github.com/acmesh-official/acme.sh/wiki/dnsapi
DNS=""


# ===============================================================
# DNS API 凭证
# 根据上面选择的 DNS 供应商，填写对应的凭证
# ===============================================================

# --- Cloudflare (新版 API Token) ---
# 请确保 Token 拥有 Zone.Zone 和 Zone.DNS 的编辑权限
CF_Token=""
CF_Account_ID=""
CF_Zone_ID=""   # 可选，但建议填写以提高验证效率

# --- 腾讯云 DNSPOD.CN ---
DP_Id=''
DP_Key=''

# --- 阿里云 ---
Ali_Key=''
Ali_Secret=''


# ===============================================================
# 群晖 (Synology) 部署配置
# ===============================================================

# 群晖账号密码
SYNO_Username=''
SYNO_Password=''

# 如果开启了双重验证(2FA)，请在浏览器登录DSM时选中“记住此设备”，
# 然后从浏览器 Cookie 中获取 'id' 的值填入下方
SYNO_Device_ID=''

# 以下群晖连接配置，若非特殊情况请勿更改
SYNO_Hostname="localhost"  # 建议使用 localhost 以避免网络回环问题
SYNO_Scheme=""
SYNO_Port=""

# 要更新的证书名称。
# 使用空字符串("")代表替代DSM中的“默认证书”，这是最常见的用法。
SYNO_Certificate=''